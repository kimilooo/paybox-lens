name: Bug report
description: Report a reproducible problem with PayBox Lens.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use demo data when possible. Redact private details; do not upload tokens, OAuth callback URLs, database/key files, private notes or real account screenshots. For security vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the page or feature affected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app in demo mode...
        2. Open...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace mode
      options:
        - Fictional demo data
        - Connected local workspace
        - Stateless / hosted workspace
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "App version/commit, Node version, OS, browser and version"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted error message or demo screenshot
      description: For missing history, include the network and coverage message. Remove addresses, handles, balances and private labels from real-account evidence.
